[bitwarden]
# Full path to the rbw executable. Leave empty to use rbw from PATH.
rbw_executable_path =

# rbw profile to use. Leave empty for rbw's default profile.
rbw_profile =

# Seconds after which a copied password/TOTP is cleared from the clipboard,
# if the clipboard still holds that exact text. 0 disables auto-clearing.
clipboard_clear_seconds = 30

[generator.default]
type = password
length = 16
uppercase = true
lowercase = true
numbers = true
special = false

[generator.strong]
type = password
length = 24
uppercase = true
lowercase = true
numbers = true
special = true

[generator.passphrase]
type = passphrase
words = 3
separator = -
capitalize = false
include_number = false

[generator.pin]
type = password
length = 6
uppercase = false
lowercase = false
numbers = true
special = false

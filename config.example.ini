[bitwarden]
# Full path to the rbw executable. Leave empty to use rbw from PATH.
rbw_executable_path =

# rbw profile to use. Leave empty for rbw's default profile.
rbw_profile =

# Seconds after which a copied password/TOTP is cleared from the clipboard,
# if the clipboard still holds that exact text. 0 disables auto-clearing.
clipboard_clear_seconds = 30

# Generator presets. Each [generator.<label>] section adds one KRunner
# match. Keys map directly onto `rbw generate` flags:
#   type = password:    length (characters), symbols (false -> --no-symbols),
#                       numbers_only (true -> --only-numbers),
#                       nonconfusables (true -> --nonconfusables)
#   type = passphrase:  words (diceware word count, --diceware)

[generator.default]
type = password
length = 16
symbols = false

[generator.strong]
type = password
length = 24
symbols = true

[generator.passphrase]
type = passphrase
words = 3

[generator.pin]
type = password
length = 6
numbers_only = true

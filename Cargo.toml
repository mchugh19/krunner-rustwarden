[package]
name = "krunner-rustwarden"
version = "0.4.3"
edition = "2021"
description = "KRunner D-Bus runner for Bitwarden, backed by the rbw CLI"
license = "MIT"

[dependencies]
zbus = "5"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
